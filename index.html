<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade 3D: Cubo vs Sfere</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background-color: #050510;
    }
    #ui {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #00fff2;
      font-size: 28px;
      font-weight: 800;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 28px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 242, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 242, 0.2);
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 15px;
      letter-spacing: 1px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      text-transform: uppercase;
    }
    .floating-text {
      position: absolute;
      color: #ff0055;
      font-weight: 900;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
    }
  </style>
</head>
<body>

  <div id="ui">SCORE: <span id="score">0</span></div>
  <div id="instructions">Clicca/Tappa per lanciare i cubi dinamici!</div>

  <!-- Library Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- SCENA, CAMERA & RENDERER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080818);
    scene.fog = new THREE.FogExp2(0x080818, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 22);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- GRIGLIA D'ARENA E LUCI ---
    const gridHelper = new THREE.GridHelper(40, 40, 0x00fff2, 0x1f1f3a);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(15, 25, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00fff2, 1, 30);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);
