<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronache di Pietra - Borgo Fantasy 3D</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', 'Georgia', serif;
      user-select: none;
      background-color: #0b0914;
    }
    #canvas-container { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute; top: 20px; right: 20px;
      color: #ffd700; font-size: 24px; font-weight: bold;
      background: rgba(20, 15, 30, 0.85);
      padding: 12px 24px; border-radius: 8px;
      border: 2px solid #b8860b;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      pointer-events: none; z-index: 10;
    }
    #instructions {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%);
      color: #f0e6d2; font-size: 15px; letter-spacing: 1px;
      background: rgba(20, 15, 30, 0.9);
      padding: 12px 28px; border-radius: 25px;
      border: 1px solid #b8860b;
      pointer-events: none; text-align: center;
      z-index: 10; text-transform: uppercase;
    }
    .floating-text {
      position: absolute; color: #ff4500; font-weight: bold; font-size: 24px;
      pointer-events: none; animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 0 10px rgba(255, 69, 0, 0.8); z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="ui">GEMME DEL TEMPO: <span id="score">0</span></div>
  <div id="instructions">Usa [W, A, S, D] per muovere l'eroe nella Piazza Storica<br>Clicca nello spazio per lanciare Runic Blocks contro le Sfere Corrotte!</div>
  <div id="canvas-container"></div>

  <script>
    if (typeof THREE === 'undefined') {
      alert("Errore nel caricamento della libreria 3D.");
    }

    const container = document.getElementById('canvas-container');

    // --- SCENA, CAMERA & RENDERER FANTASY ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1020);
    scene.fog = new THREE.FogExp2(0x0f1020, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- ILLUMINAZIONE MAGICA (Torce e Bracieri) ---
    const ambientLight = new THREE.AmbientLight(0x3b3857, 1.2);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x7694ff, 0.8);
    moonLight.position.set(20, 40, 20);
    scene.add(moonLight);

    // Fuoco magico centrale (Piazza)
    const plazaLight = new THREE.PointLight(0xff7700, 2, 25);
    plazaLight.position.set(0, 3, 0);
    scene.add(plazaLight);

    // --- CREAZIONE DELLA PIAZZA FANTASY (Pavimentazione in pietra & Mura) ---
    const plazaGeometry = new THREE.PlaneGeometry(60, 60);
    const plazaMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x2a2b38, 
      roughness: 0.8,
      metalness: 0.2
    });
    const plaza = new THREE.Mesh(plazaGeometry, plazaMaterial);
    plaza.rotation.x = -Math.PI / 2;
    plaza.receiveShadow = true;
    scene.add(plaza);

    // Colonne e Monumento Centrale
    const pillarGeo = new THREE.CylinderGeometry(1.5, 2, 6, 8);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x55586e, roughness: 0.7 });
    const centralPillar = new THREE.Mesh(pillarGeo, pillarMat);
    centralPillar.position.set(0, 3, 0);
    centralPillar.castShadow = true;
    scene.add(centralPillar);

    // --- PERSONAGGIO 3D (L'Eroe Fantasy) ---
    const heroGroup = new THREE.Group();

    // Corpo (Tunica)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f4e79, roughness: 0.5 });
    const bodyMesh = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 6), bodyMat);
    bodyMesh.position.y = 1;
    bodyMesh.castShadow = true;
    heroGroup.add(bodyMesh);

    // Testa (Elmo magico)
    const headMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), headMat);
    headMesh.position.y = 2.2;
    heroGroup.add(headMesh);

    scene.add(heroGroup);
    heroGroup.position.set(0, 0, 10);

    // --- VARIABILI DI GIOCO & MINIGIOCO ---
    let score = 0;
    const spheres = [];
    const cubes = [];
    const particles = [];

    const sphereRadius = 1.2;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    // Controlli da tastiera per l'eroe
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    // --- SFERE CORROTTE (Minigioco) ---
    function spawnSphere() {
      const geometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x9900ff, 
        roughness: 0.2, 
        metalness: 0.6,
        emissive: 0x330066
      });
      const sphere = new THREE.Mesh(geometry, material);
      sphere.castShadow = true;

      const angle = Math.random() * Math.PI * 2;
      const speed = 0.03 + Math.random() * 0.03;

      sphere.position.set(
        (Math.random() - 0.5) * 20,
        sphereRadius + Math.random() * 2,
        (Math.random() - 0.5) * 15 - 5
      );

      sphere.userData = {
        vx: Math.cos(angle) * speed,
        vz: Math.sin(angle) * speed,
        initialY: sphere.position.y,
        timeOffset: Math.random() * 100
      };

      scene.add(sphere);
      spheres.push(sphere);
    }

    // --- EFFETTO MAGICO / PARTICELLE ---
    function createExplosion(pos) {
      const particleCount = 25;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        positions.push(pos.x, pos.y, pos.z);
        velocities.push(
          (Math.random() - 0.5) * 0.4,
          (Math.random() - 0.5) * 0.4 + 0.15,
          (Math.random() - 0.5) * 0.4
        );
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0xffd700, size: 0.4, transparent: true, opacity: 1 });
      const pSystem = new THREE.Points(geometry, material);
      scene.add(pSystem);

      particles.push({ system: pSystem, velocities: velocities, life: 35 });
    }

    function showFloatingText(x, y, text) {
      const div = document.createElement('div');
      div.className = 'floating-text';
      div.innerText = text;
      div.style.left = `${x}px`;
      div.style.top = `${y}px`;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 800);
    }

    // --- LANCIO RUNIC BLOCKS ---
    function throwCube(targetPoint) {
      const cubeSize = 0.9;
      const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x00ffff, 
        roughness: 0.1,
        emissive: 0x00aaaa,
        emissiveIntensity: 0.5
      });
      const cube = new THREE.Mesh(geometry, material);

      // Parte dalla posizione attuale dell'eroe
      cube.position.copy(heroGroup.position);
      cube.position.y += 1.5;

      const direction = new THREE.Vector3().subVectors(targetPoint, cube.position).normalize();

      cubes.push({
        mesh: cube,
        velocity: direction.multiplyScalar(0.7),
        size: cubeSize,
        life: 200
      });

      scene.add(cube);
    }

    // --- INPUT CLICK ---
    window.addEventListener('pointerdown', (e) => {
      // Evita click accidentali sui bordi UI
      if (e.clientY < 80) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, target);

      if (target) {
        throwCube(target);
      }
    });

    // Inizializza 2 sfere nella piazza
    spawnSphere();
    spawnSphere();

    // --- LOOP DI GIOCO E ANIMAZIONE ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // 1. Movimento dell'Eroe nella Piazza Fantasy
      const moveSpeed = 0.12;
      if (keys.w && heroGroup.position.z > -20) heroGroup.position.z -= moveSpeed;
      if (keys.s && heroGroup.position.z < 20) heroGroup.position.z += moveSpeed;
      if (keys.a && heroGroup.position.x > -20) heroGroup.position.x -= moveSpeed;
      if (keys.d && heroGroup.position.x < 20) heroGroup.position.x += moveSpeed;

      // Segui l'eroe con la telecamera in terza persona dinamica
      camera.position.x = heroGroup.position.x;
      camera.position.y = heroGroup.position.y + 10;
      camera.position.z = heroGroup.position.z + 14;
      camera.lookAt(heroGroup.position.x, heroGroup.position.y + 1, heroGroup.position.z);

      // 2. Movimento delle Sfere Corrotte
      spheres.forEach(s => {
        s.position.x += s.userData.vx;
        s.position.z += s.userData.vz;
        s.position.y = s.userData.initialY + Math.sin(elapsedTime * 3 + s.userData.timeOffset) * 0.6;

        if (Math.abs(s.position.x) > 18) s.userData.vx *= -1;
        if (Math.abs(s.position.z) > 14) s.userData.vz *= -1;
      });

      // 3. Gestione Runic Blocks e Collisioni
      for (let i = cubes.length - 1; i >= 0; i--) {
        const c = cubes[i];
        c.mesh.position.add(c.velocity);
        c.mesh.rotation.x += 0.08;
        c.mesh.rotation.y += 0.08;
        c.life--;

        let removed = false;

        for (let j = spheres.length - 1; j >= 0; j--) {
          const s = spheres[j];
          const dist = c.mesh.position.distanceTo(s.position);
          const collisionThreshold = sphereRadius + (c.size * 0.6);

          if (dist < collisionThreshold) {
            createExplosion(s.position);

            const screenPos = s.position.clone().project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;
            showFloatingText(x, y, "+200");

            scene.remove(s);
            spheres.splice(j, 1);
            scene.remove(c.mesh);
            cubes.splice(i, 1);
            removed = true;

            score += 200;
            document.getElementById('score').innerText = score;

            // Rigenera nuove sfere per aumentare la sfida
            spawnSphere();
            spawnSphere();
            break;
          }
        }

        if (!removed && c.life <= 0) {
          scene.remove(c.mesh);
          cubes.splice(i, 1);
        }
      }

      // 4. Gestione Particelle ed Effetti
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const positions = p.system.geometry.attributes.position.array;

        for (let j = 0; j < positions.length; j += 3) {
          positions[j] += p.velocities[j];
          positions[j+1] += p.velocities[j+1];
          positions[j+2] += p.velocities[j+2];
        }

        p.system.geometry.attributes.position.needsUpdate = true;
        p.system.material.opacity = p.life / 35;
        p.life--;

        if (p.life <= 0) {
          scene.remove(p.system);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    // Ridimensionamento finestra
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
