<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cronache di Pietra - La Pecora Eroe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&display=swap');

    * { box-sizing: border-box; touch-action: none; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      user-select: none;
      background-color: #05030a;
    }
    #canvas-container { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui {
      position: absolute; top: 20px; right: 20px;
      color: #fce881; font-size: 20px; font-weight: 600;
      font-family: 'Cinzel Decorative', serif;
      background: linear-gradient(135deg, rgba(20, 15, 35, 0.9), rgba(40, 25, 60, 0.9));
      padding: 12px 24px; border-radius: 12px;
      border: 2px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      pointer-events: none; z-index: 10;
      letter-spacing: 1px;
    }

    #instructions {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: #e6dfcc; font-size: 13px; letter-spacing: 1px;
      font-family: 'Cinzel', serif;
      background: linear-gradient(135deg, rgba(20, 15, 35, 0.9), rgba(40, 25, 60, 0.9));
      padding: 10px 24px; border-radius: 30px;
      border: 1px solid #d4af37;
      pointer-events: none; text-align: center;
      z-index: 10; text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      width: 90%; max-width: 500px;
    }

    .floating-text {
      position: absolute; color: #ffcc00; font-weight: 700; font-size: 26px;
      font-family: 'Cinzel Decorative', serif;
      pointer-events: none; animation: floatUp 0.9s ease-out forwards;
      text-shadow: 0 0 12px rgba(255, 170, 0, 0.9); z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="ui">GEMME: <span id="score">0</span></div>
  <div id="instructions">Trascina la Pecora per muoverla • Tap veloce per colpire le anfore</div>
  <div id="canvas-container"></div>

  <script>
    if (typeof THREE === 'undefined') {
      alert("Errore nel caricamento della libreria grafica 3D.");
    }

    const container = document.getElementById('canvas-container');

    // --- SCENA & RENDERER HD ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06050a);
    scene.fog = new THREE.FogExp2(0x06050a, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // --- ILLUMINAZIONE ---
    const ambientLight = new THREE.AmbientLight(0x28243d, 1.5);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x6082b6, 1.2);
    moonLight.position.set(30, 50, 30);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // --- PIAZZA MEDIEVALE ---
    const plazaGeo = new THREE.CylinderGeometry(24, 25, 0.8, 32);
    const plazaMat = new THREE.MeshStandardMaterial({ color: 0x1d1e24, roughness: 0.7, metalness: 0.3 });
    const plaza = new THREE.Mesh(plazaGeo, plazaMat);
    plaza.position.y = -0.4;
    plaza.receiveShadow = true;
    scene.add(plaza);

    // --- FORNO ANTICO ---
    function createOvenMesh() {
      const ovenGroup = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x4a433e, roughness: 0.9, metalness: 0.1 });
      const brickMat = new THREE.MeshStandardMaterial({ color: 0x8c3b2b, roughness: 0.8 });
      const darkInsideMat = new THREE.MeshBasicMaterial({ color: 0x110500 });
      const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });

      const baseGeo = new THREE.BoxGeometry(5.5, 1.2, 5.5);
      const baseMesh = new THREE.Mesh(baseGeo, stoneMat);
      baseMesh.position.y = 0.6;
      baseMesh.castShadow = true;
      baseMesh.receiveShadow = true;
      ovenGroup.add(baseMesh);

      const domeGeo = new THREE.SphereGeometry(2.4, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const domeMesh = new THREE.Mesh(domeGeo, brickMat);
      domeMesh.position.y = 1.2;
      domeMesh.castShadow = true;
      ovenGroup.add(domeMesh);

      const chimneyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.8, 12);
      const chimneyMesh = new THREE.Mesh(chimneyGeo, stoneMat);
      chimneyMesh.position.set(1.2, 3.2, -1.0);
      chimneyMesh.castShadow = true;
      ovenGroup.add(chimneyMesh);

      const archGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.8, 16, 1, false, 0, Math.PI);
      const archMesh = new THREE.Mesh(archGeo, stoneMat);
      archMesh.rotation.x = Math.PI / 2;
      archMesh.position.set(0, 1.8, 2.2);
      ovenGroup.add(archMesh);

      const cavityGeo = new THREE.PlaneGeometry(1.4, 1.2);
      const cavityMesh = new THREE.Mesh(cavityGeo, darkInsideMat);
      cavityMesh.position.set(0, 1.6, 2.35);
      ovenGroup.add(cavityMesh);

      const fireGeo = new THREE.PlaneGeometry(1.2, 0.6);
      const fireMesh = new THREE.Mesh(fireGeo, fireMat);
      fireMesh.position.set(0, 1.3, 2.36);
      ovenGroup.add(fireMesh);

      const ovenLight = new THREE.PointLight(0xff5500, 4.0, 18);
      ovenLight.position.set(0, 1.6, 2.6);
      ovenLight.castShadow = true;
      ovenGroup.add(ovenLight);

      return ovenGroup;
    }

    const oven = createOvenMesh();
    scene.add(oven);

    // --- PECORA EROE ---
    const heroGroup = new THREE.Group();

    const capeMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.6 });
    const capeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.3), capeMat);
    capeMesh.position.set(0, 0.8, -0.2);
    capeMesh.castShadow = true;
    heroGroup.add(capeMesh);

    const woolMat = new THREE.MeshStandardMaterial({ color: 0xf3f4f6, roughness: 0.9 });
    const bodyMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65, 1), woolMat);
    bodyMesh.position.y = 0.9;
    bodyMesh.castShadow = true;
    heroGroup.add(bodyMesh);

    const legMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 });
    const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.6), legMat);
    leg1.position.set(-0.25, 0.3, 0);
    heroGroup.add(leg1);
    const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.6), legMat);
    leg2.position.set(0.25, 0.3, 0);
    heroGroup.add(leg2);

    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.5, 0.1);

    const headBase = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), woolMat);
    headGroup.add(headBase);

    const snoutMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7 });
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.3), snoutMat);
    snout.position.set(0, -0.05, 0.25);
    headGroup.add(snout);

    const ear1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.1), snoutMat);
    ear1.position.set(-0.35, 0.1, 0);
    ear1.rotation.z = 0.2;
    headGroup.add(ear1);

    const ear2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.1), snoutMat);
    ear2.position.set(0.35, 0.1, 0);
    ear2.rotation.z = -0.2;
    headGroup.add(ear2);

    heroGroup.add(headGroup);
    scene.add(heroGroup);
    heroGroup.position.set(0, 0, 12);

    // --- ANFORA ANTICA ---
    function createAmphoraMesh() {
      const amphoraGroup = new THREE.Group();
      const terracottaMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.7, metalness: 0.1 });

      const bodyGeo = new THREE.SphereGeometry(0.9, 16, 16);
      bodyGeo.scale(1, 1.3, 1);
      const body = new THREE.Mesh(bodyGeo, terracottaMat);
      body.castShadow = true;
      amphoraGroup.add(body);

      const neckGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.7, 12);
      const neck = new THREE.Mesh(neckGeo, terracottaMat);
      neck.position.y = 1.3;
      neck.castShadow = true;
      amphoraGroup.add(neck);

      const rimGeo = new THREE.TorusGeometry(0.35, 0.08, 8, 16);
      const rim = new THREE.Mesh(rimGeo, terracottaMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 1.65;
      amphoraGroup.add(rim);

      const baseGeo = new THREE.CylinderGeometry(0.1, 0.3, 0.4, 12);
      const base = new THREE.Mesh(baseGeo, terracottaMat);
      base.position.y = -1.2;
      amphoraGroup.add(base);

      const handleGeo = new THREE.TorusGeometry(0.3, 0.07, 8, 12, Math.PI);
      const handle1 = new THREE.Mesh(handleGeo, terracottaMat);
      handle1.rotation.z = Math.PI / 2;
      handle1.position.set(0.7, 0.5, 0);
      amphoraGroup.add(handle1);

      const handle2 = new THREE.Mesh(handleGeo, terracottaMat);
      handle2.rotation.z = -Math.PI / 2;
      handle2.position.set(-0.7, 0.5, 0);
      amphoraGroup.add(handle2);

      return amphoraGroup;
    }

    // --- VARIABILI DI GIOCO ---
    let score = 0;
    const amphorae = [];
    const cubes = [];
    const particles = [];

    const amphoraRadius = 1.2;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    // --- CONTROLLI TOUCH & DRAG PER SMARTPHONE ---
    let isDragging = false;
    let touchStartTime = 0;
    let touchStartPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (e.clientY < 80) return;
      
      touchStartTime = Date.now();
      touchStartPos = { x: e.clientX, y: e.clientY };

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersect = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, intersect);

      if (intersect) {
        // Se si tocca vicino alla pecora, si attiva il trascinamento
        const distToHero = intersect.distanceTo(heroGroup.position);
        if (distToHero < 5.0) {
          isDragging = true;
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const targetPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, targetPoint);

      if (targetPoint) {
        // Limita il trascinamento entro i bordi della piazza
        const maxDist = 18;
        if (targetPoint.length() < maxDist) {
          heroGroup.position.x = targetPoint.x;
          heroGroup.position.z = targetPoint.z;
        }
      }
    });

    window.addEventListener('pointer
