<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronache di Pietra - La Pecora Eroe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&display=swap');

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      user-select: none;
      background-color: #05030a;
    }
    #canvas-container { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui {
      position: absolute; top: 25px; right: 25px;
      color: #fce881; font-size: 22px; font-weight: 600;
      font-family: 'Cinzel Decorative', serif;
      background: linear-gradient(135deg, rgba(20, 15, 35, 0.9), rgba(40, 25, 60, 0.9));
      padding: 14px 28px; border-radius: 12px;
      border: 2px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(212, 175, 55, 0.2);
      pointer-events: none; z-index: 10;
      letter-spacing: 1px;
    }

    #instructions {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%);
      color: #e6dfcc; font-size: 14px; letter-spacing: 1.5px;
      font-family: 'Cinzel', serif;
      background: linear-gradient(135deg, rgba(20, 15, 35, 0.9), rgba(40, 25, 60, 0.9));
      padding: 12px 30px; border-radius: 30px;
      border: 1px solid #d4af37;
      pointer-events: none; text-align: center;
      z-index: 10; text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .floating-text {
      position: absolute; color: #ffcc00; font-weight: 700; font-size: 26px;
      font-family: 'Cinzel Decorative', serif;
      pointer-events: none; animation: floatUp 0.9s ease-out forwards;
      text-shadow: 0 0 12px rgba(255, 170, 0, 0.9); z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="ui">GEMME: <span id="score">0</span></div>
  <div id="instructions">Usa [W, A, S, D] per muovere la Pecora Eroe • Clicca per lanciare Rune di Luce</div>
  <div id="canvas-container"></div>

  <script>
    if (typeof THREE === 'undefined') {
      alert("Errore nel caricamento della libreria grafica 3D.");
    }

    const container = document.getElementById('canvas-container');

    // --- SCENA & RENDERER HD ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06050a);
    scene.fog = new THREE.FogExp2(0x06050a, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // --- ILLUMINAZIONE ATMOSFERICA FANTASY ---
    const ambientLight = new THREE.AmbientLight(0x28243d, 1.5);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x6082b6, 1.2);
    moonLight.position.set(30, 50, 30);
    moonLight.castShadow = true;
    scene.add(moonLight);

    const plazaLight = new THREE.PointLight(0xff5500, 3.5, 35);
    plazaLight.position.set(0, 3.5, 0);
    scene.add(plazaLight);

    // --- PIAZZA MEDIEVALE ---
    const plazaGeo = new THREE.CylinderGeometry(24, 25, 0.8, 32);
    const plazaMat = new THREE.MeshStandardMaterial({ color: 0x1d1e24, roughness: 0.7, metalness: 0.3 });
    const plaza = new THREE.Mesh(plazaGeo, plazaMat);
    plaza.position.y = -0.4;
    plaza.receiveShadow = true;
    scene.add(plaza);

    const baseGeo = new THREE.BoxGeometry(4, 0.8, 4);
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3d3f4a, roughness: 0.8, metalness: 0.2 });
    const baseMesh = new THREE.Mesh(baseGeo, stoneMat);
    baseMesh.position.y = 0.4;
    baseMesh.castShadow = true;
    scene.add(baseMesh);

    const obeliskGeo = new THREE.ConeGeometry(1.2, 7, 4);
    const obelisk = new THREE.Mesh(obeliskGeo, stoneMat);
    obelisk.position.y = 4.3;
    obelisk.castShadow = true;
    scene.add(obelisk);

    const topCrystalGeo = new THREE.OctahedronGeometry(0.8);
    const topCrystalMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xff8800, roughness: 0.1, metalness: 0.9 });
    const topCrystal = new THREE.Mesh(topCrystalGeo, topCrystalMat);
    topCrystal.position.y = 8.5;
    scene.add(topCrystal);

    // --- LA PECORA EROE SU DUE ZAMPE ---
    const heroGroup = new THREE.Group();

    // Mantello da eroe
    const capeMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.6 });
    const capeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.3), capeMat);
    capeMesh.position.set(0, 0.8, -0.2);
    capeMesh.castShadow = true;
    heroGroup.add(capeMesh);

    // Corpo soffice (Lana della pecora)
    const woolMat = new THREE.MeshStandardMaterial({ color: 0xf3f4f6, roughness: 0.9 });
    const bodyMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65, 1), woolMat);
    bodyMesh.position.y = 0.9;
    bodyMesh.castShadow = true;
    heroGroup.add(bodyMesh);

    // Gambe posteriori (su due zampe)
    const legMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 });
    const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.6), legMat);
    leg1.position.set(-0.25, 0.3, 0);
    heroGroup.add(leg1);
    const leg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.6), legMat);
    leg2.position.set(0.25, 0.3, 0);
    heroGroup.add(leg2);

    // Testa della pecora
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.5, 0.1);

    const headBase = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), woolMat);
    headGroup.add(headBase);

    // Muso scuro
    const snoutMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7 });
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.3), snoutMat);
    snout.position.set(0, -0.05, 0.25);
    headGroup.add(snout);

    // Orecchie pendenti
    const ear1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.1), snoutMat);
    ear1.position.set(-0.35, 0.1, 0);
    ear1.rotation.z = 0.2;
    headGroup.add(ear1);

    const ear2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.1), snoutMat);
    ear2.position.set(0.35, 0.1, 0);
    ear2.rotation.z = -0.2;
    headGroup.add(ear2);

    heroGroup.add(headGroup);
    scene.add(heroGroup);
    heroGroup.position.set(0, 0, 12);

    // --- VARIABILI DI GIOCO ---
    let score = 0;
    const spheres = [];
    const cubes = [];
    const particles = [];

    const sphereRadius = 1.2;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    // --- SFERE DI CRISTALLO ---
    function spawnSphere() {
      const geometry = new THREE.IcosahedronGeometry(sphereRadius, 2);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x9333ea, 
        roughness: 0.1, 
        metalness: 0.8,
        emissive: 0x581c87,
        emissiveIntensity: 0.6
      });
      const sphere = new THREE.Mesh(geometry, material);
      sphere.castShadow = true;

      const angle = Math.random() * Math.PI * 2;
      const speed = 0.035 + Math.random() * 0.03;
      const distFromCenter = 8 + Math.random() * 10;

      sphere.position.set(
        Math.cos(angle) * distFromCenter,
        sphereRadius + 1 + Math.random() * 2,
        Math.sin(angle) * distFromCenter
      );

      sphere.userData = {
        vx: Math.cos(angle + Math.PI/2) * speed * 1.2,
        vz: Math.sin(angle + Math.PI/2) * speed * 1.2,
        initialY: sphere.position.y,
        timeOffset: Math.random() * 100
      };

      scene.add(sphere);
      spheres.push(sphere);
    }

    // --- ESPLOSIONE ---
    function createExplosion(pos) {
      const particleCount = 35;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        positions.push(pos.x, pos.y, pos.z);
        velocities.push(
          (Math.random() - 0.5) * 0.5,
          (Math.random() - 0.5) * 0.5 + 0.2,
          (Math.random() - 0.5) * 0.5
        );
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ 
        color: 0xfde047, 
        size: 0.45, 
        transparent: true, 
        opacity: 1,
        blending: THREE.AdditiveBlending
      });
      const pSystem = new THREE.Points(geometry, material);
      scene.add(pSystem);

      particles.push({ system: pSystem, velocities: velocities, life: 40 });
    }

    function showFloatingText(x, y, text) {
      const div = document.createElement('div');
      div.className = 'floating-text';
      div.innerText = text;
      div.style.left = `${x}px`;
      div.style.top = `${y}px`;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 900);
    }

    // --- LANCIO CUBI RUNICI ---
    function throwCube(targetPoint) {
      const cubeSize = 0.85;
      const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      const material = new THREE.MeshStandardMaterial({ 
        color: 0x38bdf8, 
        roughness: 0.1,
        metalness: 0.5,
        emissive: 0x0284c7,
        emissiveIntensity: 0.8
      });
      const cube = new THREE.Mesh(geometry, material);
      cube.castShadow = true;

      cube.position.copy(heroGroup.position);
      cube.position.y += 1.0;

      const direction = new THREE.Vector3().subVectors(targetPoint, cube.position).normalize();

      cubes.push({
        mesh: cube,
        velocity: direction.multiplyScalar(0.75),
        size: cubeSize,
        life: 200
      });

      scene.add(cube);
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.clientY < 80) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, target);

      if (target) {
        throwCube(target);
      }
    });

    spawnSphere();
    spawnSphere();
    spawnSphere();

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      topCrystal.rotation.y = elapsedTime * 1.5;
      topCrystal.position.y = 8.5 + Math.sin(elapsedTime * 3) * 0.3;

      const moveSpeed = 0.13;
      if (keys.w && heroGroup.position.z > -18) heroGroup.position.z -= moveSpeed;
      if (keys.s && heroGroup.position.z < 18) heroGroup.position.z += moveSpeed;
      if (keys.a && heroGroup.position.x > -18) heroGroup.position.x -= moveSpeed;
      if (keys.d && heroGroup.position.x < 18) heroGroup.position.x += moveSpeed;

      // Leggero dondolio mentre cammina
      if (keys.w || keys.a || keys.s || keys.d) {
        heroGroup.position.y = Math.sin(elapsedTime * 15) * 0.08;
      } else {
        heroGroup.position.y = 0;
      }

      camera.position.x = heroGroup.position.x;
      camera.position.y = heroGroup.position.y + 10;
      camera.position.z = heroGroup.position.z + 14;
      camera.lookAt(heroGroup.position.x, heroGroup.position.y + 1, heroGroup.position.z);

      spheres.forEach(s => {
        s.position.x += s.userData.vx;
        s.position.z += s.userData.vz;
        s.position.y = s.userData.initialY + Math.sin(elapsedTime * 4 + s.userData.timeOffset) * 0.5;
        s.rotation.x += 0.01;
        s.rotation.y += 0.02;

        const distFromCenter = Math.sqrt(s.position.x**2 + s.position.z**2);
        if (distFromCenter > 20) {
          s.userData.vx *= -1;
          s.userData.vz *= -1;
        }
      });

      for (let i = cubes.length - 1; i >= 0; i--) {
        const c = cubes[i];
        c.mesh.position.add(c.velocity);
        c.mesh.rotation.x += 0.1;
        c.mesh.rotation.y += 0.1;
        c.life--;

        let removed = false;

        for (let j = spheres.length - 1; j >= 0; j--) {
          const s = spheres[j];
          const dist = c.mesh.position.distanceTo(s.position);
          const collisionThreshold = sphereRadius + (c.size * 0.6);

          if (dist < collisionThreshold) {
            createExplosion(s.position);

            const screenPos = s.position.clone().project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;
            showFloatingText(x, y, "+250");

            scene.remove(s);
            spheres.splice(j, 1);
            scene.remove(c.mesh);
            cubes.splice(i, 1);
            removed = true;

            score += 250;
            document.getElementById('score').innerText = score;

            spawnSphere();
            spawnSphere();
            break;
          }
        }

        if (!removed && c.life <= 0) {
          scene.remove(c.mesh);
          cubes.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const positions = p.system.geometry.attributes.position.array;

        for (let j = 0; j < positions.length; j += 3) {
          positions[j] += p.velocities[j];
          positions[j+1] += p.velocities[j+1];
          positions[j+2] += p.velocities[j+2];
        }

        p.system.geometry.attributes.position.needsUpdate = true;
        p.system.material.opacity = p.life / 40;
        p.life--;

        if (p.life <= 0) {
          scene.remove(p.system);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
