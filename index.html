<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gioco Cubo e Sfere</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #score-board {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 8px;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="score-board">Punteggio: <span id="score">0</span></div>

  <!-- Importazione di Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. Scena, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 2. Creazione Cubo (Giocatore)
    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
    const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
    cube.position.y = 0.5;
    scene.add(cube);

    // 3. Gestione Sfere e Punteggio
    let score = 0;
    const spheres = [];
    const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
    const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0xff4757 });

    function addSphere() {
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      // Posizione casuale entro l'area di gioco
      sphere.position.x = (Math.random() - 0.5) * 16;
      sphere.position.z = (Math.random() - 0.5) * 16;
      sphere.position.y = 0.5;
      scene.add(sphere);
      spheres.push(sphere);
    }

    // Genera la prima sfera
    addSphere();

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // 4. Game Loop & Collisioni
    function animate() {
      requestAnimationFrame(animate);

      // Movimento Cubo (Freccette o WASD)
      const speed = 0.15;
      if (keys['ArrowUp'] || keys['w']) cube.position.z -= speed;
      if (keys['ArrowDown'] || keys['s']) cube.position.z += speed;
      if (keys['ArrowLeft'] || keys['a']) cube.position.x -= speed;
      if (keys['ArrowRight'] || keys['d']) cube.position.x += speed;

      // Limiti campo di gioco
      cube.position.x = Math.max(-9, Math.min(9, cube.position.x));
      cube.position.z = Math.max(-9, Math.min(9, cube.position.z));

      // Controlla collisioni con ogni sfera
      for (let i = spheres.length - 1; i >= 0; i--) {
        const sphere = spheres[i];
        const distance = cube.position.distanceTo(sphere.position);

        // Raggio cubo (~0.5) + Raggio sfera (0.5) = 1.0
        if (distance < 0.9) {
          // Rimuovi sfera colpita
          scene.remove(sphere);
          spheres.splice(i, 1);

          // Aggiorna punteggio
          score++;
          document.getElementById('score').innerText = score;

          // Aggiungi 2 nuove sfere (una al posto di quella tolta + una extra)
          addSphere();
          addSphere();
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Ridimensionamento finestra
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
